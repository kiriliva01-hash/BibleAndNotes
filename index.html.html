<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свет Истины - Библия и Дневник</title>
    <style>
        :root {
            --brown-dark: #3e2723;
            --brown: #5d4037;
            --brown-light: #795548;
            --beige-dark: #d7ccc8;
            --beige: #efebe9;
            --beige-light: #f5f0eb;
            --gold: #c9a96e;
            --gold-light: #e8d5b0;
            --white: #ffffff;
            --red: #c62828;
            --shadow: 0 2px 10px rgba(62, 39, 35, 0.2);
            --shadow-lg: 0 10px 30px rgba(62, 39, 35, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Segoe UI', serif;
            background: #2c1810;
            background-image: 
                radial-gradient(ellipse at top left, rgba(201, 169, 110, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(139, 90, 43, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at center, rgba(62, 39, 35, 0.3) 0%, transparent 70%),
                linear-gradient(135deg, #3e2723 0%, #5d4037 30%, #4e342e 60%, #3e2723 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--brown-dark);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(201, 169, 110, 0.03) 2px, rgba(201, 169, 110, 0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(201, 169, 110, 0.03) 2px, rgba(201, 169, 110, 0.03) 4px);
            pointer-events: none;
            z-index: 0;
        }

        .page {
            display: none;
            min-height: 100vh;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .page.active {
            display: block;
            position: relative;
        }

        .main-menu-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(201, 169, 110, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 90, 43, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(201, 169, 110, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, #3e2723 0%, #5d4037 30%, #4e342e 60%, #3e2723 100%);
            position: relative;
        }

        .main-menu-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a96e' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
            pointer-events: none;
        }

        .menu-decoration {
            position: absolute;
            font-size: 15rem;
            color: rgba(201, 169, 110, 0.05);
            pointer-events: none;
            user-select: none;
        }

        .menu-decoration.top-left { top: 5%; left: 5%; }
        .menu-decoration.top-right { top: 10%; right: 5%; }
        .menu-decoration.bottom-left { bottom: 10%; left: 8%; }
        .menu-decoration.bottom-right { bottom: 5%; right: 10%; }

        .menu-container {
            text-align: center;
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(245,240,235,0.95) 100%);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.3),
                0 0 0 1px rgba(201,169,110,0.2) inset;
            max-width: 550px;
            width: 100%;
            border: 3px solid var(--gold-light);
            animation: fadeInUp 0.6s ease;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cross-icon {
            font-size: 4rem;
            color: var(--gold);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
            text-shadow: 0 2px 10px rgba(201,169,110,0.3);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .menu-container h1 {
            color: var(--brown);
            font-size: 2.5rem;
            margin-bottom: 10px;
            position: relative;
        }

        .menu-container h1::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background: var(--gold);
            margin: 15px auto;
            border-radius: 2px;
        }

        .subtitle {
            color: var(--brown-light);
            font-style: italic;
            margin-bottom: 40px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            padding: 20px 30px;
            border: 2px solid var(--beige-dark);
            border-radius: 15px;
            background: linear-gradient(135deg, var(--beige-light) 0%, var(--white) 100%);
            color: var(--brown);
            text-decoration: none;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(201,169,110,0.1), transparent);
            transition: left 0.5s;
        }

        .menu-btn:hover::before {
            left: 100%;
        }

        .menu-btn:hover {
            background: linear-gradient(135deg, var(--brown) 0%, var(--brown-light) 100%);
            color: var(--white);
            border-color: var(--brown);
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .menu-btn:active {
            transform: translateY(-2px);
        }

        .menu-btn .icon {
            font-size: 2.5rem;
            min-width: 50px;
            text-align: center;
        }

        .menu-btn .btn-text {
            text-align: left;
        }

        .menu-btn .btn-title {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .menu-btn .btn-desc {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        .app-page {
            background: linear-gradient(135deg, var(--beige-light) 0%, var(--beige) 50%, var(--white) 100%);
            background-attachment: fixed;
        }

        .top-bar {
            background: linear-gradient(135deg, var(--brown-dark) 0%, var(--brown) 100%);
            color: var(--white);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--gold);
        }

        .back-btn {
            background: linear-gradient(135deg, var(--gold) 0%, #b8960a 100%);
            color: var(--brown-dark);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            font-family: 'Georgia', serif;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .back-btn:hover {
            background: var(--gold-light);
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        .app-title {
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bible-container {
            display: flex;
            height: calc(100vh - 72px);
            background: 
                radial-gradient(circle at 30% 50%, rgba(201,169,110,0.05) 0%, transparent 50%),
                linear-gradient(135deg, var(--beige-light) 0%, var(--beige) 100%);
        }

        .books-sidebar {
            width: 320px;
            background: linear-gradient(180deg, var(--white) 0%, var(--beige-light) 100%);
            border-right: 2px solid var(--beige-dark);
            overflow-y: auto;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--beige-dark);
            background: linear-gradient(180deg, var(--beige) 0%, transparent 100%);
        }

        .sidebar-header h3 {
            color: var(--brown);
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .sidebar-header .books-count {
            color: var(--gold);
            font-size: 0.9rem;
        }

        .search-box {
            padding: 15px;
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, var(--beige) 0%, rgba(239,235,233,0.95) 100%);
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid var(--beige-dark);
            border-radius: 25px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
            font-family: 'Georgia', serif;
            background: white;
        }

        .search-box input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(201, 169, 110, 0.3);
        }

        .books-list {
            list-style: none;
            padding: 10px;
        }

        .book-item {
            padding: 12px 15px;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 5px;
            transition: all 0.2s;
            color: var(--brown);
            font-size: 0.95rem;
            border-left: 3px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .book-item:hover {
            background: var(--beige);
            padding-left: 20px;
            border-left-color: var(--gold);
        }

        .book-item.active {
            background: linear-gradient(135deg, var(--brown) 0%, var(--brown-light) 100%);
            color: var(--white);
            border-left-color: var(--gold);
        }

        .book-chapters-count {
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .bible-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: 
                radial-gradient(circle at 70% 30%, rgba(232,213,176,0.2) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23c9a96e' fill-opacity='0.03'%3E%3Ccircle cx='50' cy='50' r='3'/%3E%3C/g%3E%3C/svg%3E");
        }

        .bible-header {
            text-align: center;
            padding: 20px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--white) 0%, var(--beige-light) 100%);
            border-radius: 15px;
            box-shadow: var(--shadow);
            border: 1px solid var(--beige-dark);
        }

        .bible-header h2 {
            color: var(--brown);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .chapter-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, var(--white) 0%, var(--beige-light) 100%);
            border-radius: 15px;
            box-shadow: var(--shadow);
            border: 1px solid var(--beige-dark);
        }

        .chapter-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--beige) 0%, var(--beige-light) 100%);
            border: 2px solid var(--beige-dark);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
        }

        .chapter-btn:hover {
            background: var(--gold-light);
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(201,169,110,0.2);
        }

        .chapter-btn.active {
            background: linear-gradient(135deg, var(--brown) 0%, var(--brown-light) 100%);
            color: var(--white);
            border-color: var(--brown);
        }

        .verses-container {
            background: linear-gradient(135deg, var(--white) 0%, var(--beige-light) 100%);
            padding: 30px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            border: 1px solid var(--beige-dark);
        }

        .verses-header {
            text-align: center;
            padding-bottom: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gold-light);
        }

        .verse {
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.8;
            position: relative;
            border-left: 3px solid transparent;
            background: rgba(255,255,255,0.5);
        }

        .verse:hover {
            background: var(--beige);
            border-left-color: var(--gold-light);
            transform: translateX(5px);
        }

        .verse.highlighted {
            background: linear-gradient(135deg, var(--gold-light) 0%, #f5e6cc 100%);
            border-left: 4px solid var(--gold);
            box-shadow: 0 2px 8px rgba(201,169,110,0.2);
        }

        .verse-number {
            font-weight: bold;
            color: var(--gold);
            margin-right: 10px;
            font-size: 0.9rem;
            background: rgba(201,169,110,0.1);
            padding: 2px 8px;
            border-radius: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
        }

        .empty-state .icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .diary-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px;
            height: calc(100vh - 72px);
            overflow-y: auto;
            background: 
                radial-gradient(circle at 50% 0%, rgba(201,169,110,0.05) 0%, transparent 50%);
        }

        .diary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, rgba(245,240,235,0.98) 0%, rgba(245,240,235,0.9) 100%);
            padding: 20px;
            z-index: 10;
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .diary-header h2 {
            color: var(--brown);
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .diary-stats {
            color: var(--brown-light);
            font-size: 0.9rem;
        }

        .add-note-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--brown) 0%, var(--brown-light) 100%);
            color: var(--white);
            border: none;
            border-radius: 50%;
            font-size: 2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transition: all 0.3s;
            border: 2px solid var(--gold);
        }

        .add-note-btn:hover {
            background: var(--gold);
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 12px 30px rgba(201,169,110,0.4);
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .note-card {
            background: linear-gradient(135deg, var(--white) 0%, var(--beige-light) 100%);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s;
            border-left: 5px solid var(--gold);
            position: relative;
            animation: fadeInUp 0.5s ease;
            border: 1px solid var(--beige-dark);
            overflow: hidden;
        }

        .note-card::before {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(201,169,110,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .note-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border-left-color: var(--brown);
        }

        .note-title {
            font-size: 1.3rem;
            color: var(--brown);
            margin-bottom: 15px;
            font-weight: bold;
            position: relative;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--beige-dark);
        }

        .note-preview {
            color: var(--brown-light);
            font-size: 0.95rem;
            line-height: 1.6;
            position: relative;
            min-height: 60px;
        }

        .note-date {
            color: var(--gold);
            font-size: 0.85rem;
            margin-top: 15px;
            position: relative;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .delete-context-menu {
            display: none;
            position: fixed;
            background: linear-gradient(135deg, var(--white) 0%, var(--beige-light) 100%);
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 20px;
            z-index: 1000;
            text-align: center;
            animation: fadeInUp 0.2s ease;
            border: 1px solid var(--beige-dark);
        }

        .delete-context-menu.active {
            display: block;
        }

        .delete-context-menu p {
            margin-bottom: 15px;
            color: var(--brown-dark);
            font-size: 1.1rem;
        }

        .delete-context-menu button {
            margin: 5px;
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            transition: all 0.3s;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .confirm-delete {
            background: linear-gradient(135deg, var(--red) 0%, #d32f2f 100%);
            color: white;
            box-shadow: 0 4px 10px rgba(198,40,40,0.3);
        }

        .cancel-delete {
            background: linear-gradient(135deg, var(--beige-dark) 0%, #bcaaa4 100%);
            color: var(--brown);
        }

        .note-editor {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(62, 39, 35, 0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .note-editor.active {
            display: flex;
        }

        .editor-content {
            background: linear-gradient(135deg, var(--white) 0%, var(--beige-light) 100%);
            padding: 40px;
            border-radius: 20px;
            max-width: 650px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            animation: fadeInUp 0.3s ease;
            border: 2px solid var(--gold-light);
        }

        .editor-content h3 {
            color: var(--brown);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .editor-content input,
        .editor-content textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid var(--beige-dark);
            border-radius: 10px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            background: white;
        }

        .editor-content input:focus,
        .editor-content textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(201, 169, 110, 0.2);
        }

        .editor-content textarea {
            min-height: 300px;
            resize: vertical;
            line-height: 1.6;
        }

        .editor-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .editor-buttons button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            transition: all 0.3s;
            font-weight: bold;
        }

        .save-note-btn {
            background: linear-gradient(135deg, var(--brown) 0%, var(--brown-light) 100%);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .save-note-btn:hover {
            background: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201,169,110,0.4);
        }

        .cancel-note-btn {
            background: linear-gradient(135deg, var(--beige-dark) 0%, #bcaaa4 100%);
            color: var(--brown);
        }

        @media (max-width: 768px) {
            .bible-container {
                flex-direction: column;
            }
            
            .books-sidebar {
                width: 100%;
                max-height: 300px;
            }
            
            .menu-container {
                padding: 30px 20px;
            }
            
            .menu-container h1 {
                font-size: 2rem;
            }
            
            .notes-grid {
                grid-template-columns: 1fr;
            }
            
            .top-bar {
                padding: 10px 15px;
            }
            
            .app-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Главное меню -->
    <div class="page active" id="mainMenuPage">
        <div class="main-menu-page">
            <div class="menu-decoration top-left">✝</div>
            <div class="menu-decoration top-right">📖</div>
            <div class="menu-decoration bottom-left">🕊</div>
            <div class="menu-decoration bottom-right">✝</div>
            
            <div class="menu-container">
                <div class="cross-icon">✝</div>
                <h1>Свет Истины</h1>
                <p class="subtitle">Слово Твоё — светильник ноге моей<br>и свет стезе моей</p>
                <div class="menu-buttons">
                    <button class="menu-btn" onclick="navigateTo('bible')">
                        <span class="icon">📖</span>
                        <span class="btn-text">
                            <div class="btn-title">Библия</div>
                            <div class="btn-desc">Читайте Священное Писание</div>
                        </span>
                    </button>
                    <button class="menu-btn" onclick="navigateTo('diary')">
                        <span class="icon">📔</span>
                        <span class="btn-text">
                            <div class="btn-title">Дневник</div>
                            <div class="btn-desc">Записывайте мысли и откровения</div>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Страница Библии -->
    <div class="page" id="biblePage">
        <div class="app-page">
            <div class="top-bar">
                <button class="back-btn" onclick="navigateTo('main')">
                    ← Назад
                </button>
                <span class="app-title">📖 Библия</span>
                <div style="width: 100px;"></div>
            </div>
            <div id="bibleContent"></div>
        </div>
    </div>

    <!-- Страница Дневника -->
    <div class="page" id="diaryPage">
        <div class="app-page">
            <div class="top-bar">
                <button class="back-btn" onclick="navigateTo('main')">
                    ← Назад
                </button>
                <span class="app-title">📔 Дневник</span>
                <div style="width: 100px;"></div>
            </div>
            <div id="diaryContent"></div>
        </div>
    </div>

    <!-- Контекстное меню удаления -->
    <div class="delete-context-menu" id="deleteMenu">
        <p>Удалить заметку?</p>
        <button class="confirm-delete" id="confirmDelete">Удалить</button>
        <button class="cancel-delete" id="cancelDelete">Отмена</button>
    </div>

    <!-- Редактор заметки -->
    <div class="note-editor" id="noteEditor">
        <div class="editor-content">
            <h3 id="editorTitle">Новая заметка</h3>
            <input type="text" id="noteTitleInput" placeholder="Название заметки...">
            <textarea id="noteContentInput" placeholder="Содержание заметки..."></textarea>
            <div class="editor-buttons">
                <button class="cancel-note-btn" onclick="closeEditor()">Отмена</button>
                <button class="save-note-btn" onclick="saveNote()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        // Структура Библии
        const BIBLE_BOOKS = [
            {"name":"Бытие","chapters":50,"abbr":"gen"},
            {"name":"Исход","chapters":40,"abbr":"exo"},
            {"name":"Левит","chapters":27,"abbr":"lev"},
            {"name":"Числа","chapters":36,"abbr":"num"},
            {"name":"Второзаконие","chapters":34,"abbr":"deu"},
            {"name":"Иисус Навин","chapters":24,"abbr":"jos"},
            {"name":"Судей","chapters":21,"abbr":"jdg"},
            {"name":"Руфь","chapters":4,"abbr":"rut"},
            {"name":"1 Царств","chapters":31,"abbr":"1sa"},
            {"name":"2 Царств","chapters":24,"abbr":"2sa"},
            {"name":"3 Царств","chapters":22,"abbr":"1ki"},
            {"name":"4 Царств","chapters":25,"abbr":"2ki"},
            {"name":"1 Паралипоменон","chapters":29,"abbr":"1ch"},
            {"name":"2 Паралипоменон","chapters":36,"abbr":"2ch"},
            {"name":"Ездра","chapters":10,"abbr":"ezr"},
            {"name":"Неемия","chapters":13,"abbr":"neh"},
            {"name":"Есфирь","chapters":10,"abbr":"est"},
            {"name":"Иов","chapters":42,"abbr":"job"},
            {"name":"Псалтирь","chapters":150,"abbr":"psa"},
            {"name":"Притчи","chapters":31,"abbr":"pro"},
            {"name":"Екклесиаст","chapters":12,"abbr":"ecc"},
            {"name":"Песнь Песней","chapters":8,"abbr":"sng"},
            {"name":"Исаия","chapters":66,"abbr":"isa"},
            {"name":"Иеремия","chapters":52,"abbr":"jer"},
            {"name":"Плач Иеремии","chapters":5,"abbr":"lam"},
            {"name":"Иезекииль","chapters":48,"abbr":"ezk"},
            {"name":"Даниил","chapters":12,"abbr":"dan"},
            {"name":"Осия","chapters":14,"abbr":"hos"},
            {"name":"Иоиль","chapters":3,"abbr":"jol"},
            {"name":"Амос","chapters":9,"abbr":"amo"},
            {"name":"Авдий","chapters":1,"abbr":"oba"},
            {"name":"Иона","chapters":4,"abbr":"jon"},
            {"name":"Михей","chapters":7,"abbr":"mic"},
            {"name":"Наум","chapters":3,"abbr":"nam"},
            {"name":"Аввакум","chapters":3,"abbr":"hab"},
            {"name":"Софония","chapters":3,"abbr":"zep"},
            {"name":"Аггей","chapters":2,"abbr":"hag"},
            {"name":"Захария","chapters":14,"abbr":"zec"},
            {"name":"Малахия","chapters":4,"abbr":"mal"},
            {"name":"От Матфея","chapters":28,"abbr":"mat"},
            {"name":"От Марка","chapters":16,"abbr":"mrk"},
            {"name":"От Луки","chapters":24,"abbr":"luk"},
            {"name":"От Иоанна","chapters":21,"abbr":"jhn"},
            {"name":"Деяния","chapters":28,"abbr":"act"},
            {"name":"Иакова","chapters":5,"abbr":"jas"},
            {"name":"1 Петра","chapters":5,"abbr":"1pe"},
            {"name":"2 Петра","chapters":3,"abbr":"2pe"},
            {"name":"1 Иоанна","chapters":5,"abbr":"1jn"},
            {"name":"2 Иоанна","chapters":1,"abbr":"2jn"},
            {"name":"3 Иоанна","chapters":1,"abbr":"3jn"},
            {"name":"Иуды","chapters":1,"abbr":"jud"},
            {"name":"К Римлянам","chapters":16,"abbr":"rom"},
            {"name":"1 Коринфянам","chapters":16,"abbr":"1co"},
            {"name":"2 Коринфянам","chapters":13,"abbr":"2co"},
            {"name":"К Галатам","chapters":6,"abbr":"gal"},
            {"name":"К Ефесянам","chapters":6,"abbr":"eph"},
            {"name":"К Филиппийцам","chapters":4,"abbr":"php"},
            {"name":"К Колоссянам","chapters":4,"abbr":"col"},
            {"name":"1 Фессалоникийцам","chapters":5,"abbr":"1th"},
            {"name":"2 Фессалоникийцам","chapters":3,"abbr":"2th"},
            {"name":"1 Тимофею","chapters":6,"abbr":"1ti"},
            {"name":"2 Тимофею","chapters":4,"abbr":"2ti"},
            {"name":"К Титу","chapters":3,"abbr":"tit"},
            {"name":"К Филимону","chapters":1,"abbr":"phm"},
            {"name":"К Евреям","chapters":13,"abbr":"heb"},
            {"name":"Откровение","chapters":22,"abbr":"rev"}
        ];

        // Кэш загруженных глав
        const bibleCache = {};

        // Функция загрузки главы с bible-api.com
        async function loadChapter(bookIndex, chapterNum) {
            const cacheKey = `${bookIndex}-${chapterNum}`;
            
            // Проверяем кэш в памяти
            if (bibleCache[cacheKey]) {
                return bibleCache[cacheKey];
            }
            
            // Проверяем localStorage
            const stored = localStorage.getItem(`bible_${cacheKey}`);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    bibleCache[cacheKey] = data;
                    return data;
                } catch (e) {}
            }
            
            const book = BIBLE_BOOKS[bookIndex];
            
            try {
                // Используем bible-api.com с русским переводом
                const response = await fetch(
                    `https://bible-api.com/${book.name}+${chapterNum}?translation=synodal`,
                    { signal: AbortSignal.timeout(5000) }
                );
                
                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.verses && data.verses.length > 0) {
                        const verses = data.verses.map(v => v.text.trim());
                        
                        // Сохраняем в кэш
                        bibleCache[cacheKey] = verses;
                        try {
                            localStorage.setItem(`bible_${cacheKey}`, JSON.stringify(verses));
                        } catch (e) {}
                        
                        return verses;
                    }
                }
            } catch (e) {
                console.log('Ошибка загрузки через bible-api.com:', e.message);
            }
            
            // Запасной вариант: используем getbible.net
            try {
                const response = await fetch(
                    `https://getbible.net/json?passage=${book.abbr}+${chapterNum}&lang=ru`,
                    { signal: AbortSignal.timeout(5000) }
                );
                
                if (response.ok) {
                    const text = await response.text();
                    // getbible.net оборачивает JSON в скобки
                    const jsonStr = text.replace(/^\(/, '').replace(/\);$/, '');
                    const data = JSON.parse(jsonStr);
                    
                    if (data.book && data.book.length > 0) {
                        const verses = [];
                        data.book.forEach(chapterData => {
                            if (chapterData.chapter) {
                                Object.values(chapterData.chapter).forEach(verse => {
                                    if (verse && verse.verse) {
                                        verses.push(verse.verse);
                                    }
                                });
                            }
                        });
                        
                        if (verses.length > 0) {
                            bibleCache[cacheKey] = verses;
                            try {
                                localStorage.setItem(`bible_${cacheKey}`, JSON.stringify(verses));
                            } catch (e) {}
                            return verses;
                        }
                    }
                }
            } catch (e) {
                console.log('Ошибка загрузки через getbible.net:', e.message);
            }
            
            // Если все API недоступны, возвращаем заглушку
            return [
                `Блажен муж, который не ходит на совет нечестивых и не стоит на пути грешных.`,
                `Но в законе Господа воля его, и о законе Его размышляет он день и ночь!`,
                `И будет он как дерево, посаженное при потоках вод, которое приносит плод свой во время свое.`,
                `Не так — нечестивые; но они — как прах, возметаемый ветром.`,
                `Потому не устоят нечестивые на суде, и грешники — в собрании праведных.`,
                `Ибо знает Господь путь праведных, а путь нечестивых погибнет.`
            ];
        }

        // Состояние приложения
        let currentPage = 'main';
        let currentBook = null;
        let currentChapter = null;
        let notes = JSON.parse(localStorage.getItem('diaryNotes') || '[]');
        let editingNoteId = null;
        let deletingNoteId = null;

        // Навигация
        function navigateTo(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            
            switch(page) {
                case 'main':
                    document.getElementById('mainMenuPage').classList.add('active');
                    currentPage = 'main';
                    break;
                case 'bible':
                    document.getElementById('biblePage').classList.add('active');
                    currentPage = 'bible';
                    renderBible();
                    break;
                case 'diary':
                    document.getElementById('diaryPage').classList.add('active');
                    currentPage = 'diary';
                    renderDiary();
                    break;
            }
            
            window.scrollTo(0, 0);
        }

        // Рендер Библии
        function renderBible() {
            document.getElementById('bibleContent').innerHTML = `
                <div class="bible-container">
                    <div class="books-sidebar">
                        <div class="sidebar-header">
                            <h3>📚 Книги Библии</h3>
                            <span class="books-count">${BIBLE_BOOKS.length} книг</span>
                        </div>
                        <div class="search-box">
                            <input type="text" id="bookSearch" placeholder="🔍 Поиск книги..." oninput="filterBooks()">
                        </div>
                        <ul class="books-list" id="booksList">
                            ${BIBLE_BOOKS.map((book, index) => `
                                <li class="book-item" data-index="${index}" data-name="${book.name.toLowerCase()}" onclick="selectBook(${index})">
                                    <span>${book.name}</span>
                                    <span class="book-chapters-count">${book.chapters} гл.</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                    <div class="bible-content" id="bibleContentView">
                        <div class="empty-state">
                            <div class="icon">📖</div>
                            <h3>Священное Писание</h3>
                            <p>Выберите книгу из списка слева</p>
                            <p style="margin-top: 10px; font-size: 0.9rem;">Все Писание богодухновенно<br>и полезно для научения</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function filterBooks() {
            const searchTerm = document.getElementById('bookSearch').value.toLowerCase();
            const bookItems = document.querySelectorAll('.book-item');
            
            bookItems.forEach(item => {
                const bookName = item.getAttribute('data-name');
                item.style.display = bookName.includes(searchTerm) ? 'flex' : 'none';
            });
        }

        function selectBook(index) {
            currentBook = index;
            const book = BIBLE_BOOKS[index];
            
            document.querySelectorAll('.book-item').forEach(item => item.classList.remove('active'));
            document.querySelector(`.book-item[data-index="${index}"]`).classList.add('active');
            
            document.getElementById('bibleContentView').innerHTML = `
                <div class="bible-header">
                    <h2>${book.name}</h2>
                    <p class="book-info">${book.chapters} глав</p>
                </div>
                <div class="chapter-selector">
                    ${Array.from({length: book.chapters}, (_, i) => `
                        <button class="chapter-btn" onclick="selectChapter(${i + 1})">
                            Гл. ${i + 1}
                        </button>
                    `).join('')}
                </div>
                <div id="versesContainer">
                    <div class="empty-state">
                        <div class="icon">📜</div>
                        <h3>Выберите главу</h3>
                        <p>для чтения Слова Божьего</p>
                    </div>
                </div>
            `;
        }

        async function selectChapter(chapterNum) {
            currentChapter = chapterNum;
            const book = BIBLE_BOOKS[currentBook];
            
            document.querySelectorAll('.chapter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Показываем загрузку
            document.getElementById('versesContainer').innerHTML = `
                <div class="verses-container" style="text-align: center;">
                    <div style="font-size: 3rem; animation: float 2s infinite;">📖</div>
                    <p style="color: var(--brown-light);">Загрузка стихов...</p>
                </div>
            `;
            
            // Загружаем главу
            const verses = await loadChapter(currentBook, chapterNum);
            
            const highlightedVerses = JSON.parse(localStorage.getItem('highlightedVerses') || '{}');
            const bookKey = `${currentBook}-${chapterNum}`;
            
            document.getElementById('versesContainer').innerHTML = `
                <div class="verses-container">
                    <div class="verses-header">
                        <h3>${book.name} — Глава ${chapterNum}</h3>
                    </div>
                    ${verses.map((verse, index) => {
                        const verseKey = `${bookKey}-${index}`;
                        const isHighlighted = highlightedVerses[verseKey];
                        return `
                            <div class="verse ${isHighlighted ? 'highlighted' : ''}" 
                                 data-verse-key="${verseKey}"
                                 onclick="toggleHighlight(this, '${verseKey}')">
                                <span class="verse-number">${index + 1}</span>
                                ${verse}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function toggleHighlight(element, verseKey) {
            const highlightedVerses = JSON.parse(localStorage.getItem('highlightedVerses') || '{}');
            
            if (highlightedVerses[verseKey]) {
                delete highlightedVerses[verseKey];
                element.classList.remove('highlighted');
            } else {
                highlightedVerses[verseKey] = true;
                element.classList.add('highlighted');
            }
            
            localStorage.setItem('highlightedVerses', JSON.stringify(highlightedVerses));
        }

        // Дневник
        function renderDiary() {
            document.getElementById('diaryContent').innerHTML = `
                <div class="diary-container">
                    <div class="diary-header">
                        <div>
                            <h2>📔 Мои заметки</h2>
                            <p class="diary-stats">${notes.length} ${getNotesWord(notes.length)}</p>
                        </div>
                        <button class="add-note-btn" onclick="createNewNote()">+</button>
                    </div>
                    <div class="notes-grid" id="notesGrid">
                        ${notes.length === 0 ? 
                            `<div class="empty-state" style="grid-column: 1/-1;">
                                <div class="icon">📝</div>
                                <h3>Нет заметок</h3>
                                <p>Нажмите "+" чтобы создать новую заметку</p>
                            </div>` :
                            notes.map((note, index) => `
                                <div class="note-card" 
                                     onclick="openNote(${index})"
                                     oncontextmenu="showDeleteMenu(event, ${index})">
                                    <div class="note-title">${note.title || 'Без названия'}</div>
                                    <div class="note-preview">${note.content.substring(0, 150)}${note.content.length > 150 ? '...' : ''}</div>
                                    <div class="note-date">📅 ${note.date}</div>
                                </div>
                            `).join('')
                        }
                    </div>
                </div>
            `;
        }

        function getNotesWord(count) {
            if (count % 10 === 1 && count % 100 !== 11) return 'заметка';
            if ([2, 3, 4].includes(count % 10) && ![12, 13, 14].includes(count % 100)) return 'заметки';
            return 'заметок';
        }

        function createNewNote() {
            editingNoteId = null;
            document.getElementById('editorTitle').textContent = 'Новая заметка';
            document.getElementById('noteTitleInput').value = '';
            document.getElementById('noteContentInput').value = '';
            document.getElementById('noteEditor').classList.add('active');
        }

        function openNote(index) {
            editingNoteId = index;
            const note = notes[index];
            document.getElementById('editorTitle').textContent = 'Редактировать заметку';
            document.getElementById('noteTitleInput').value = note.title;
            document.getElementById('noteContentInput').value = note.content;
            document.getElementById('noteEditor').classList.add('active');
        }

        function saveNote() {
            const title = document.getElementById('noteTitleInput').value.trim();
            const content = document.getElementById('noteContentInput').value.trim();
            
            if (!content) {
                alert('Введите содержание заметки');
                return;
            }
            
            const note = {
                title: title || 'Без названия',
                content: content,
                date: new Date().toLocaleDateString('ru-RU', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                })
            };
            
            if (editingNoteId !== null) {
                notes[editingNoteId] = note;
            } else {
                notes.unshift(note);
            }
            
            localStorage.setItem('diaryNotes', JSON.stringify(notes));
            closeEditor();
            renderDiary();
        }

        function closeEditor() {
            document.getElementById('noteEditor').classList.remove('active');
            editingNoteId = null;
        }

        function showDeleteMenu(event, index) {
            event.preventDefault();
            event.stopPropagation();
            
            deletingNoteId = index;
            
            const menu = document.getElementById('deleteMenu');
            menu.style.left = Math.min(event.pageX, window.innerWidth - 200) + 'px';
            menu.style.top = Math.min(event.pageY, window.innerHeight - 150) + 'px';
            menu.classList.add('active');
        }

        document.getElementById('confirmDelete').addEventListener('click', function() {
            if (deletingNoteId !== null) {
                notes.splice(deletingNoteId, 1);
                localStorage.setItem('diaryNotes', JSON.stringify(notes));
                renderDiary();
                deletingNoteId = null;
                document.getElementById('deleteMenu').classList.remove('active');
            }
        });

        document.getElementById('cancelDelete').addEventListener('click', function() {
            deletingNoteId = null;
            document.getElementById('deleteMenu').classList.remove('active');
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.delete-context-menu') && !e.target.closest('.note-card')) {
                document.getElementById('deleteMenu').classList.remove('active');
            }
        });
    </script>
</body>
</html>
